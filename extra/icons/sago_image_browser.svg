  <!-- Up arrow in top-left folder -->
  <g stroke="#111111" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 90V60"/>
    <path d="M56 76L70 60L84 76"/>
  </g>

  <!-- Large eye overlapping folders -->
  <g transform="translate(240 110)">
    <!-- Eye shape -->
    <path
      d="M110 40C175 40 232 76 270 128C232 180 175 216 110 216C58 216 8 188 -34 128C8 68 58 40 110 40Z"
