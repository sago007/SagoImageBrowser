    <!-- Iris - Vibrant Gradient Blue -->
    <circle
      cx="118"
      cy="128"
      r="54"
      fill="#06B6D4"
      stroke="#111111"
      stroke-width="12"
    />

    <!-- Iris pattern rings -->
    <circle
      cx="118"
      cy="128"
      r="42"
      fill="none"
      stroke="#0891B2"
      stroke-width="6"
      opacity="0.6"
