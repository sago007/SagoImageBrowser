      <!-- Folder body -->
      <rect x="40" y="48" width="60" height="60" rx="6" fill="#3B82F6"/>
    </g>
    <g>
      <!-- Folder tab - Red -->
      <rect x="140" y="34" width="36" height="18" rx="4" fill="#DC2626"/>
      <!-- Folder body -->
      <rect x="140" y="52" width="60" height="60" rx="6" fill="#EF4444"/>
    </g>
    <g>
      <!-- Folder tab - Yellow -->
      <rect x="240" y="34" width="36" height="18" rx="4" fill="#D97706"/>
      <!-- Folder body -->
      <rect x="240" y="52" width="60" height="60" rx="6" fill="#FBBF24"/>
