      <!-- Folder body -->
      <rect x="40" y="372" width="60" height="60" rx="6" fill="#6366F1"/>
    </g>
    <g>
      <!-- Folder tab - Rose -->
      <rect x="140" y="354" width="36" height="18" rx="4" fill="#BE185D"/>
      <!-- Folder body -->
      <rect x="140" y="372" width="60" height="60" rx="6" fill="#F43F5E"/>
    </g>
    <g>
