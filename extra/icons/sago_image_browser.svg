    <!-- Row 2 -->
    <g>
      <!-- Folder tab - Green -->
      <rect x="40" y="138" width="36" height="18" rx="4" fill="#059669"/>
      <!-- Folder body -->
      <rect x="40" y="156" width="60" height="60" rx="6" fill="#10B981"/>
    </g>
    <g>
      <!-- Folder tab - Purple -->
      <rect x="140" y="138" width="36" height="18" rx="4" fill="#7C3AED"/>
      <!-- Folder body -->
      <rect x="140" y="156" width="60" height="60" rx="6" fill="#A78BFA"/>
    </g>
    <g>
      <!-- Folder tab - Pink -->
      <rect x="240" y="138" width="36" height="18" rx="4" fill="#DB2777"/>
      <!-- Folder body -->
      <rect x="240" y="156" width="60" height="60" rx="6" fill="#EC4899"/>
    </g>

    <!-- Row 3 -->
    <g>
      <!-- Folder tab - Teal -->
      <rect x="40" y="246" width="36" height="18" rx="4" fill="#0D9488"/>
      <!-- Folder body -->
      <rect x="40" y="264" width="60" height="60" rx="6" fill="#14B8A6"/>
    </g>
    <g>
      <!-- Folder tab - Orange -->
      <rect x="140" y="246" width="36" height="18" rx="4" fill="#EA580C"/>
      <!-- Folder body -->
      <rect x="140" y="264" width="60" height="60" rx="6" fill="#FB923C"/>
    </g>
    <g>
      <!-- Folder tab - Cyan -->
