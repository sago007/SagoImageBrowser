<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="72" fill="#F4F4F4"/>

  <!-- Folder grid -->
  <g stroke="#111111" stroke-width="10" stroke-linejoin="round">
