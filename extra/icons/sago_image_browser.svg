    <!-- Pupil -->
    <circle
      cx="118"
      cy="128"
      r="24"
      fill="#111111"
    />

    <!-- Highlight - bright glow -->
    <circle
      cx="100"
      cy="110"
      r="8"
      fill="#FFFFFF"
    />
    <circle
      cx="100"
      cy="110"
      r="5"
      fill="#E0F2FE"
      opacity="0.7"
    />
